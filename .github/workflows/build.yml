name: Build & Publish Test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p _src
          unzip -q marsa_baghdad.zip -d _src
          echo "SRC=$(ls -d _src/*/ | head -1)" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fetch category tile photos
        working-directory: ${{ env.SRC }}
        run: |
          mkdir -p assets/tiles
          dl(){ curl -fsSL --max-time 45 -o "assets/tiles/$1" "$2" && echo "OK $1" || echo "FALLBACK $1"; }
          dl flights.jpg  "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800&q=70&auto=format&fit=crop"
          dl hotels.jpg   "https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=800&q=70&auto=format&fit=crop"
          dl offers.jpg   "https://images.unsplash.com/photo-1610641818989-c2051b5e2cfd?w=800&q=70&auto=format&fit=crop"
          dl visa.jpg     "https://images.unsplash.com/photo-1581553673739-c4906b5d0de8?w=800&q=70&auto=format&fit=crop"
          dl status.jpg   "https://images.unsplash.com/photo-1664190426381-5f2cf0ea4ef4?w=800&q=70&auto=format&fit=crop"
          dl services.jpg "https://images.unsplash.com/photo-1578894381163-e72c17f2d45f?w=800&q=70&auto=format&fit=crop"
          ls -la assets/tiles
      - name: Build test APK (debug-signed)
        working-directory: ${{ env.SRC }}
        run: |
          flutter create --platforms=android --project-name marsa_baghdad .
          python3 patch_manifest.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - name: Inspect APK for tile photos
        working-directory: ${{ env.SRC }}
        run: |
          echo "== tile assets inside the built APK =="
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -i "assets/tiles" || echo "!! NO TILE ASSETS IN APK !!"
      - name: Publish to permanent "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="MarsaBaghdad-r${{ github.run_number }}.apk"
          cp "${{ env.SRC }}build/app/outputs/flutter-apk/app-release.apk" "$APK"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" \
            --title "Marsa Baghdad — Test Build" \
            --notes "أحدث نسخة تجريبية من تطبيق مرسى بغداد. افتح صفحة التثبيت للتحميل."
