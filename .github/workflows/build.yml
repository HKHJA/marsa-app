name: Build & Publish Test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p _src
          unzip -q marsa_baghdad.zip -d _src
          echo "SRC=$(ls -d _src/*/ | head -1)" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fetch category tile photos
        working-directory: ${{ env.SRC }}
        run: |
          mkdir -p assets/tiles
          dl(){ curl -fsSL --max-time 45 -o "assets/tiles/$1" "$2" && echo "OK $1" || echo "FALLBACK $1"; }
          dl flights.jpg  "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=800&q=70&auto=format&fit=crop"
          dl hotels.jpg   "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800&q=70&auto=format&fit=crop"
          dl offers.jpg   "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=70&auto=format&fit=crop"
          dl visa.jpg     "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&q=70&auto=format&fit=crop"
          dl status.jpg   "https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=800&q=70&auto=format&fit=crop"
          dl services.jpg "https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800&q=70&auto=format&fit=crop"
          ls -la assets/tiles
      - name: Build test APK (debug-signed)
        working-directory: ${{ env.SRC }}
        run: |
          flutter create --platforms=android --project-name marsa_baghdad .
          python3 patch_manifest.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - name: Publish to permanent "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ env.SRC }}build/app/outputs/flutter-apk/app-release.apk" MarsaBaghdad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MarsaBaghdad.apk \
            --title "Marsa Baghdad — Test Build" \
            --notes "أحدث نسخة تجريبية من تطبيق مرسى بغداد. افتح صفحة التثبيت للتحميل."
